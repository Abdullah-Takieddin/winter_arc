name: winter_arc
description: "Winter Arc – Dips, Klimmzüge und Schlaf über den Winter tracken."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: Phosphor-Fill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
