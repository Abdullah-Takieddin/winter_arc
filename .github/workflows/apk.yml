name: APK bauen

on:
  push:
    branches: [main]
    paths: ['winter_arc/**', '.github/workflows/apk.yml']
  pull_request:
    paths: ['winter_arc/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: winter_arc

# Two quick merges must not race each other while replacing the release.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk winter-arc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: winter-arc-apk
          path: winter_arc/winter-arc.apk
      # On main: replace the "latest" release so the APK can be downloaded
      # straight from the phone's browser. Deleting and recreating it moves
      # the tag to this commit and swaps the file; editing a release in
      # place left the old APK behind.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest winter-arc.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Winter Arc · $(date -u +%d.%m.%Y) · ${GITHUB_SHA::7}" \
            --notes "Gebaut aus ${GITHUB_SHA::7}. Auf dem Handy öffnen und über die alte Version installieren – deine Einträge bleiben erhalten."
